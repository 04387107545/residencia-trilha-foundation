name: Debug OIDC
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Header e tempos do token
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import sys,base64,json,time
          t=sys.argv[1].split('.')
          dec=lambda s: json.loads(base64.urlsafe_b64decode(s+'='*(-len(s)%4)))
          h=dec(t[0]); p=dec(t[1])
          print('header:',json.dumps(h))
          print('iat nbf exp agora:',p.get('iat'),p.get('nbf'),p.get('exp'),int(time.time()))
          print('claims:',sorted(p.keys()))
          PY
      - name: Chaves publicas do GitHub
        run: |
          curl -sS https://token.actions.githubusercontent.com/.well-known/openid-configuration | jq '{issuer,jwks_uri,id_token_signing_alg_values_supported}'
          curl -sS https://token.actions.githubusercontent.com/.well-known/jwks | jq '.keys[] | {kid,alg,kty,use}'